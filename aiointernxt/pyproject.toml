[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiointernxt"
version = "0.2.0"
description = "Async client for Internxt Drive (end-to-end encrypted cloud storage)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = ["aiohttp>=3.11", "cryptography>=43"]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio", "pytest-timeout"]

[tool.setuptools.package-data]
aiointernxt = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
